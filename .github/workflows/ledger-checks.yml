name: Ledger checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "Completed baseline application run UUID"
        required: true
        type: string
      candidate_run_id:
        description: "Completed candidate application run UUID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m py_compile \
            ledger/judges/judge.py ledger/judges/judge_groq.py ledger/pipeline/golden_set.py ledger/pipeline/evaluation_runs.py ledger/pipeline/costs.py \
            ledger/pipeline/regression.py ledger/pipeline/prompt_evaluation.py ledger/pipeline/injection_scan.py ledger/pipeline/release_policy.py ledger/pipeline/provenance.py ledger/pipeline/runtime_binding.py \
            ledger/pipeline/container_binding.py ledger/pipeline/orchestration.py ledger/pipeline/preflight.py ledger/pipeline/spend_plan.py ledger/pipeline/cost_reconciliation.py ledger/pipeline/spend_reservations.py ledger/pipeline/reservation_recovery.py ledger/pipeline/execution_context.py ledger/pipeline/reservation_reconciliation.py ledger/pipeline/evidence_bundle.py \
            ledger/__main__.py ledger/cli.py \
            ledger/pipeline/policy_portability.py ledger/pipeline/recovery_drill.py

      - name: Test product API and judge
        run: python -m unittest tests.test_judge tests.test_judge_groq tests.test_api -v

      - name: Test compatibility and stable CLI
        run: python -m unittest tests.test_compatibility tests.test_cli -v


      - name: Test cost attribution
        run: python -m ledger.pipeline.costs test

      - name: Test regression gate
        run: python -m ledger.pipeline.regression test

      - name: Test injection monitoring
        run: python -m ledger.pipeline.injection_scan test

      - name: Test release policy
        run: python -m ledger.pipeline.release_policy test

      - name: Test commit provenance
        run: python -m ledger.pipeline.provenance test

      - name: Test runtime binding
        run: python -m ledger.pipeline.runtime_binding test

      - name: Test container binding
        run: python -m ledger.pipeline.container_binding test

      - name: Test evaluation orchestration
        run: python -m ledger.pipeline.orchestration test

      - name: Test preflight validation
        run: python -m ledger.pipeline.preflight test

      - name: Test spend planning
        run: python -m ledger.pipeline.spend_plan test

      - name: Test cost reconciliation
        run: python -m ledger.pipeline.cost_reconciliation test

      - name: Test spend reservations
        run: python -m ledger.pipeline.spend_reservations test

      - name: Test reservation recovery
        run: python -m ledger.pipeline.reservation_recovery test

      - name: Test execution context
        run: python -m ledger.pipeline.execution_context test

      - name: Test reservation-scoped reconciliation
        run: python -m ledger.pipeline.reservation_reconciliation test

      - name: Test portable evidence bundles
        run: python -m ledger.pipeline.evidence_bundle test

      - name: Test historical pricing-policy portability
        run: python -m ledger.pipeline.policy_portability test

      - name: Test recovery drill validation
        run: python -m ledger.pipeline.recovery_drill test

  release-check:
    name: Check saved release evidence
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ledger-evaluation

    env:
      DATABASE_URL: ${{ secrets.LEDGER_DATABASE_URL }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      EXPECTED_COMMIT: ${{ github.sha }}
      EVAL_IMAGE: ${{ vars.LEDGER_EVAL_IMAGE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate configuration
        run: |
          python - <<'PY'
          import os
          import uuid

          if not os.getenv("DATABASE_URL"):
              raise SystemExit("LEDGER_DATABASE_URL is not configured.")

          baseline = uuid.UUID(os.environ["BASELINE_RUN_ID"])
          candidate = uuid.UUID(os.environ["CANDIDATE_RUN_ID"])

          if baseline == candidate:
              raise SystemExit("Choose two different application runs.")

          print("Database secret is present and run IDs are valid.")
          PY

      - name: Check container-bound release evidence
        run: |
          python -m ledger.pipeline.container_binding check \
            --image "$EVAL_IMAGE" \
            --baseline "$BASELINE_RUN_ID" \
            --candidate "$CANDIDATE_RUN_ID" \
            --expected-commit "$EXPECTED_COMMIT" \
            --allowed-drop 0.05 \
            --quality-floor 0.75

      - name: Upload release decision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/day13/*.json
          if-no-files-found: warn
          retention-days: 7
